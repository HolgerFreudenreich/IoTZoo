services:
  iotzoo:
    image: ${DOCKER_REGISTRY-}iotzoo
    restart: always
    build:
      context: .
      dockerfile: UI/Blazor/Dockerfile
    ports:
      - 8085:8080
      - 1883:1883
    volumes:
      - iotzoo_databases:/app/Database/Data
    environment:
      - AppSettings__ConnectionStringSqlite=Data Source=./Database/Data/iotzoo.db
      - AppSettings__ConnectionStringSqliteDatabaseTopicHistory=Data Source=./Database/Data/TopicHistory.db
      - AppSettings__ConnectionStringSqliteDatabaseComponentManagement=Data Source=./Database/Data/ComponentManagement.db
      - AppSettings__ConnectionStringSqliteDatabaseScripting=Data Source=./Database/Data/Scripting.db
      - AppSettings__ConnectionStringSqliteDatabaseSettings=Data Source=./Database/Data/Settings.db


